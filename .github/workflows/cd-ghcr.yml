name: CD - Build & Push Images (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  packages: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eldercare-backend:latest
            ghcr.io/${{ github.repository_owner }}/eldercare-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eldercare-frontend:latest
            ghcr.io/${{ github.repository_owner }}/eldercare-frontend:${{ github.sha }}

      - name: Output image names
        run: |
          echo "Backend image: ghcr.io/${{ github.repository_owner }}/eldercare-backend:${{ github.sha }}"
          echo "Frontend image: ghcr.io/${{ github.repository_owner }}/eldercare-frontend:${{ github.sha }}"
