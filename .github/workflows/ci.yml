name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eldercare
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff==0.6.9 mypy==1.11.2 radon==6.0.1 vulture==2.11 pip-audit==2.7.3 bandit==1.7.10 pytest-cov==5.0.0
      - name: Lint and type-check backend
        run: |
          python -m compileall backend/app backend/tests
          ruff check \
            backend/app/services/conversation_engine.py \
            backend/app/services/matching_engine.py \
            backend/app/services/admin_intelligence.py \
            backend/app/services/task_intelligence.py \
            backend/app/services/worker_conversation.py \
            backend/tests/test_conversation_engine.py \
            backend/tests/test_matching_engine.py \
            backend/tests/test_admin_intelligence.py \
            backend/tests/test_task_intelligence.py \
            backend/tests/test_worker_conversation.py
          mypy \
            backend/app/services/conversation_engine.py \
            backend/app/services/matching_engine.py \
            backend/app/services/admin_intelligence.py \
            backend/app/services/task_intelligence.py \
            backend/app/services/worker_conversation.py \
            --ignore-missing-imports
      - name: Security audit backend
        run: |
          pip-audit -r backend/requirements.txt
          bandit -q -r backend/app --severity-level high
      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/eldercare" >> backend/.env
      - name: Run migrations
        run: |
          python backend/scripts/run_migrations.py
      - name: Run tests
        run: |
          cd backend
          pytest -q
      - name: Docker compose config
        run: docker compose config --quiet

  frontend:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      - name: Lint and type-check frontend
        run: |
          cd frontend
          npm run lint
          npm run type-check
      - name: Security audit frontend
        run: |
          cd frontend
          npm audit --audit-level=high
      - name: Build frontend
        run: |
          cd frontend
          npm run build
