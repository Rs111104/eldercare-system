name: Automation Service Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/automation/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install repo deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest httpx fastapi uvicorn
      - name: Run unit tests
        run: |
          pytest -q monitoring/automation/service/tests -q
      - name: Build docker image
        run: |
          docker build -t eldercare/automation:ci monitoring/automation/service
