name: Automation Integration Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'monitoring/automation/**'

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docker image
        run: |
          docker build -t eldercare/automation:ci monitoring/automation/service
      - name: Run container
        run: |
          docker run -d --name automation_ci -p 5001:5000 eldercare/automation:ci
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:5001/health; then exit 0; fi; sleep 1;
          done
      - name: Send test alert
        run: |
          curl -XPOST -d '[{"labels": {"alertname": "CIAlert", "severity": "warning"}, "annotations": {"summary": "CI test"}}]' -H "Content-Type: application/json" http://localhost:5001/alert
      - name: Stop container
        run: |
          docker rm -f automation_ci
