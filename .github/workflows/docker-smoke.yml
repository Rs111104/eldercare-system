name: Docker Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and run smoke test
        env:
          IMAGE_TAG: eldercare-backend:smoke
        run: |
          docker build -t $IMAGE_TAG -f backend/Dockerfile backend
          docker run -d --name smoke_test -p 8000:8000 $IMAGE_TAG
          # wait for health
          for i in {1..30}; do
            if curl -sS -f http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "healthy"
              break
            fi
            sleep 2
          done
          docker logs smoke_test || true
          docker stop smoke_test
          docker rm smoke_test
