global:
  resolve_timeout: 5m
route:
  receiver: 'team-slack'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: 'pagerduty'
    - match:
        severity: warning
      receiver: 'team-slack'

receivers:
  - name: 'team-slack'
    slack_configs:
      - api_url: '${ALERT_SLACK_WEBHOOK}'
        channel: '#alerts'
        text: "[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}\n{{ range .Alerts }}\n*{{ .Labels.alertname }}* - {{ .Annotations.description }}\n{{ end }}"

  - name: 'pagerduty'
    pagerduty_configs:
      - routing_key: '${PAGERDUTY_INTEGRATION_KEY}'
        severity: '{{ .CommonLabels.severity | default "error" }}'
        details:
          summary: '{{ .CommonAnnotations.summary }}'

  - name: 'automation'
    webhook_configs:
      - url: 'http://automation:5000/alert'
        http_config:
          headers:
            X-Alert-Token: '${ALERT_WEBHOOK_SECRET}'
